name: Guftin iOS Simulator — Build and Launch QA

on:
  workflow_dispatch:
  push:
    branches:
      - release/guftin-v1.5.7-no-email-verification
      - release/guftin-v1.5.8-no-email-verification
      - feature/guftin-20-feature-upgrade
    paths:
      - "apps/kingchat/**"
      - ".github/workflows/guftin-ios-simulator.yml"

permissions:
  contents: read

concurrency:
  group: guftin-ios-simulator-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-simulator:
    name: Build Guftin and launch on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        working-directory: apps/kingchat
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: apps/kingchat
        run: npm run typecheck

      - name: Generate a clean iOS native project
        working-directory: apps/kingchat
        run: npx expo prebuild --clean --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/kingchat/ios
        run: pod install

      - name: Build iOS Simulator application
        working-directory: apps/kingchat
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then
            echo "::error::Expo did not generate an iOS workspace."
            exit 1
          fi
          XCODE_LIST="$(xcodebuild -list -workspace "$WORKSPACE" -json)"
          SCHEME="$(printf '%s' "$XCODE_LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const schemes=j.workspace?.schemes||[];if(!schemes.length)process.exit(2);console.log(schemes.find(x=>x==="Guftin")||schemes[0]);});')"
          echo "Building Xcode scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/Guftin-iOS-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find "$RUNNER_TEMP/Guftin-iOS-DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::iOS Simulator .app was not produced."
            exit 1
          fi
          echo "GUFTIN_IOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install and launch on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | sed -nE '/iPhone/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "::error::No available iPhone Simulator was found."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$GUFTIN_IOS_APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.guftin.app
          sleep 25
          xcrun simctl get_app_container "$DEVICE_ID" com.guftin.app app >/dev/null
          echo "Guftin installed and launched on iOS Simulator ($DEVICE_ID)."

      - name: Package iOS Simulator build
        if: success()
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$GUFTIN_IOS_APP_PATH" "$RUNNER_TEMP/Guftin-iOS-Simulator.zip"
          ls -lh "$RUNNER_TEMP/Guftin-iOS-Simulator.zip"

      - name: Upload iOS Simulator artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guftin-iOS-Simulator-QA-${{ github.run_number }}
          path: ${{ runner.temp }}/Guftin-iOS-Simulator.zip
          if-no-files-found: ignore
          retention-days: 14
