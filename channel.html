<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087e6c">
<title>Open channel in Guftin</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102b27;background:#f4f8f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(520px,100%);background:#fff;border:1px solid #e3eee8;border-radius:25px;padding:30px;text-align:center;box-shadow:0 18px 55px #0b4a3912}
.logo{width:76px;height:76px;border-radius:22px;background:#087e6c;color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900;margin:0 auto 18px}
h1{font-size:25px;margin:0 0 8px}p{color:#71857e;line-height:1.6}
.code{font-size:12px;overflow-wrap:anywhere;background:#f1f7f4;border:1px solid #e0ece5;border-radius:12px;padding:12px;margin:14px 0}
a{display:inline-block;text-decoration:none;background:#087e6c;color:#fff;font-size:15px;font-weight:850;padding:14px 21px;border-radius:13px}
.secondary{background:#e8f5ee;color:#087e6c}.note{font-size:12px;margin-top:18px}
</style></head>
<body><main><div class="logo">G</div><h1 id="title">Open this channel in Guftin</h1>
<p id="message">If Guftin is installed, this invitation should open in the app. Otherwise, use the app link below.</p>
<div class="code" id="invite">Reading invitation…</div>
<a id="open" href="#">Open in Guftin</a>
<p class="note">If the app did not open automatically, tap “Open in Guftin”.</p>
<a class="secondary" href="https://github.com/guftinofficle-arch/Guftin-/actions/workflows/guftin-android-apk.yml">Get Guftin APK</a>
</main>
<script>
(function(){
 const parts=window.location.pathname.split('/').filter(Boolean);
 const i=parts.findIndex(x=>x.toLowerCase()==='channel');
 let code=i>=0?parts[i+1]||'':'';
 try{code=decodeURIComponent(code)}catch(e){}
 const invite=document.getElementById('invite'),open=document.getElementById('open');
 if(!code){document.getElementById('title').textContent='Channel link is incomplete';document.getElementById('message').textContent='Ask the channel owner to share a new invitation link.';invite.textContent='No invitation code found';open.hidden=true;return;}
 invite.textContent='Channel invitation: '+code;
 open.href='kingchat://channel/'+encodeURIComponent(code);
})();
</script></body></html>
