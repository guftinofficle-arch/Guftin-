<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087e6c"><title>Guftin Channels</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102b27;background:#f4f8f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(520px,100%);background:#fff;border:1px solid #e3eee8;border-radius:26px;padding:32px;text-align:center;box-shadow:0 18px 55px #0b4a3912}
.logo{width:82px;height:82px;border-radius:22px;background:#087e6c;color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;margin:0 auto 18px}
h1{margin:0;font-size:28px}p{color:#71857e;line-height:1.65}
a{display:inline-block;text-decoration:none;background:#087e6c;color:#fff;font-weight:800;padding:14px 22px;border-radius:14px;margin-top:10px}
.small{font-size:12px}
</style></head>
<body><main><div class="logo">G</div><h1>Guftin Channels</h1>
<p>Share and open Guftin channel invitations with a secure HTTPS link.</p>
<p class="small">When Guftin is installed, verified channel links open directly in the app.</p>
</main></body></html>
